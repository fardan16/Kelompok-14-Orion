<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Lingkaran latar merah -->
  <circle cx="80" cy="80" r="80" fill="#c0392b"/>

  <!-- Lingkaran dalam (aksen) -->
  <circle cx="80" cy="80" r="68" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Mangkok bakso - badan mangkok -->
  <ellipse cx="80" cy="92" rx="38" ry="14" fill="#fff" opacity="0.95"/>
  <path d="M42 92 Q42 118 80 118 Q118 118 118 92 Z" fill="#fff" opacity="0.95"/>

  <!-- Mangkok bakso - bibir atas -->
  <ellipse cx="80" cy="92" rx="38" ry="9" fill="#fdf0ee"/>
  <ellipse cx="80" cy="92" rx="30" ry="6" fill="#f5d8d4"/>

  <!-- Bakso - bola utama di tengah -->
  <circle cx="80" cy="82" r="13" fill="#c0392b"/>
  <circle cx="76" cy="78" r="3.5" fill="rgba(255,255,255,0.25)"/>

  <!-- Bakso - bola kecil kiri -->
  <circle cx="58" cy="86" r="8" fill="#e74c3c"/>
  <circle cx="55.5" cy="83.5" r="2" fill="rgba(255,255,255,0.2)"/>

  <!-- Bakso - bola kecil kanan -->
  <circle cx="102" cy="86" r="8" fill="#e74c3c"/>
  <circle cx="99.5" cy="83.5" r="2" fill="rgba(255,255,255,0.2)"/>

  <!-- Uap (tiga garis lengkung di atas) -->
  <path d="M66 68 Q68 62 66 56" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M80 65 Q82 59 80 53" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M94 68 Q96 62 94 56" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Bintang / meteor kecil pojok kanan atas -->
  <polygon points="130,28 132.5,35 140,35 134,39.5 136.5,47 130,42.5 123.5,47 126,39.5 120,35 127.5,35"
           fill="#f1c40f" opacity="0.92"/>

  <!-- Bintang kecil pojok kiri atas -->
  <polygon points="30,40 31.5,44.5 36,44.5 32.5,47 34,51.5 30,48.5 26,51.5 27.5,47 24,44.5 28.5,44.5"
           fill="#f1c40f" opacity="0.65"/>
</svg>

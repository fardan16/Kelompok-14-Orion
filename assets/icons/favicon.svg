<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="bg" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#2E1208"/>
      <stop offset="100%" stop-color="#160D04"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DEAC45"/>
      <stop offset="100%" stop-color="#C4901C"/>
    </linearGradient>
    <linearGradient id="rimG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DEAC45"/>
      <stop offset="100%" stop-color="#C4901C"/>
    </linearGradient>
    <clipPath id="clip">
      <circle cx="16" cy="16" r="15.5"/>
    </clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>

  <g clip-path="url(#clip)">
    <!-- Meteor trail streaks -->
    <line x1="4" y1="8" x2="20" y2="17" stroke="rgba(196,144,28,0.22)" stroke-width="4" stroke-linecap="round"/>
    <line x1="4" y1="8" x2="20" y2="17" stroke="rgba(222,172,69,0.40)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="11" x2="17" y2="18" stroke="rgba(196,144,28,0.14)" stroke-width="2" stroke-linecap="round"/>

    <!-- Trail sparks -->
    <circle cx="9" cy="11" r="0.7" fill="rgba(222,172,69,0.7)"/>
    <circle cx="13" cy="13.5" r="0.5" fill="rgba(222,172,69,0.6)"/>

    <!-- Bowl body -->
    <path d="M7,17 Q7,26 16,26 Q25,26 25,17 Z" fill="#1A0A04"/>

    <!-- Broth surface -->
    <ellipse cx="16" cy="17" rx="9" ry="2.2" fill="#7B1A1A" opacity="0.9"/>

    <!-- Bakso balls -->
    <circle cx="12.5" cy="16.2" r="2.1" fill="#3D1A0A"/>
    <circle cx="16.2" cy="15.7" r="2.3" fill="#3D1A0A"/>
    <circle cx="20" cy="16.4" r="1.9" fill="#3D1A0A"/>

    <!-- Bowl rim -->
    <ellipse cx="16" cy="17" rx="9" ry="2.2" fill="none" stroke="url(#rimG)" stroke-width="1.8"/>

    <!-- Meteor core -->
    <g filter="url(#glow)">
      <circle cx="21.5" cy="11" r="3.2" fill="rgba(196,144,28,0.18)"/>
      <circle cx="21.5" cy="11" r="2.4" fill="url(#gold)"/>
      <circle cx="20.4" cy="10" r="0.9" fill="rgba(255,245,200,0.6)"/>
    </g>
  </g>

  <!-- Outer gold ring -->
  <circle cx="16" cy="16" r="15" fill="none" stroke="rgba(196,144,28,0.45)" stroke-width="1"/>
</svg>
